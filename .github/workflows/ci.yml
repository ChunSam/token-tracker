name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build + smoke tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Smoke tests
        run: swift run TokenTrackerSmokeTests

      # Release-path smoke: assemble the same .app the release workflow ships and
      # check it carries its own resources, so a packaging break is caught on every
      # PR instead of only when someone installs a DMG (the Windows job has the
      # equivalent publish smoke below).
      - name: Build app bundle (release-path smoke)
        run: bash scripts/build_app.sh

      - name: Verify app bundle
        run: swift scripts/verify_app_bundle.swift ".build/Token Tracker.app"

  windows:
    name: Windows build + tests
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Core smoke tests
        run: dotnet run --project windows/TokenTracker.Windows.Tests/TokenTracker.Windows.Tests.csproj

      - name: Build WinForms app
        run: dotnet build windows/TokenTracker.Windows/TokenTracker.Windows.csproj -c Release

      # Release-path smoke: exercise the same self-contained single-file publish
      # the release workflow uses (windows-release.yml), so a publish-only quirk
      # is caught on every PR instead of surfacing only at release. win-x64 only
      # (primary target); win-arm64 remains validated by the release workflow.
      - name: Publish WinForms app (release-path smoke)
        run: >
          dotnet publish windows/TokenTracker.Windows/TokenTracker.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:PublishReadyToRun=false
          /p:Version=0.0.0
          /p:AssemblyVersion=0.0.0.${{ github.run_number }}
          /p:FileVersion=0.0.0.${{ github.run_number }}
          -o ${{ runner.temp }}/publish-smoke

      # The version only matters if it survives into the published exe, which is
      # what Copy Diagnostics reads back. Assert the stamp landed rather than that
      # the flags parsed.
      - name: Verify published version stamp
        shell: pwsh
        run: |
          $exe = Join-Path "${{ runner.temp }}/publish-smoke" "TokenTracker.Windows.exe"
          $stamped = (Get-Item $exe).VersionInfo.FileVersion
          $expected = "0.0.0.${{ github.run_number }}"
          if ($stamped -ne $expected) {
            throw "published exe reports '$stamped', expected '$expected'"
          }
          Write-Host "published exe reports $stamped"
