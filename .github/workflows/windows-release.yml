name: Windows Release Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.3
        required: true
        default: v1.0.3

jobs:
  build:
    name: Build Windows ${{ matrix.rid }} exe
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # AssemblyVersion takes numbers only: drop the leading v and any prerelease suffix.
          $appVersion = ("${{ inputs.version }}" -replace '^v', '') -replace '-.*$', ''
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run Windows smoke tests
        run: dotnet run --project windows/TokenTracker.Windows.Tests/TokenTracker.Windows.Tests.csproj

      - name: Publish Windows app
        run: >
          dotnet publish windows/TokenTracker.Windows/TokenTracker.Windows.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          /p:PublishSingleFile=true
          /p:PublishReadyToRun=false
          /p:Version=${{ steps.version.outputs.app_version }}
          /p:AssemblyVersion=${{ steps.version.outputs.app_version }}.${{ github.run_number }}
          /p:FileVersion=${{ steps.version.outputs.app_version }}.${{ github.run_number }}
          -o artifacts/TokenTracker.Windows-${{ matrix.rid }}

      - name: Package exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path artifacts/TokenTracker.Windows-${{ matrix.rid }}/* `
            -DestinationPath "dist/TokenTracker.Windows-${{ inputs.version }}-${{ matrix.rid }}.zip" `
            -Force

      - name: Generate checksum
        shell: pwsh
        run: |
          $zip = "dist/TokenTracker.Windows-${{ inputs.version }}-${{ matrix.rid }}.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $name = Split-Path $zip -Leaf
          # LF, not the CRLF Out-File writes — a trailing CR makes shasum -c look for a
          # filename that ends in one, so the shipped checksum never verifies.
          # .NET file APIs use the process working directory, which is not PowerShell's
          # location, so resolve the path before handing it over.
          $shaPath = [System.IO.Path]::GetFullPath((Join-Path (Get-Location).Path "$zip.sha256"))
          [System.IO.File]::WriteAllText($shaPath, "$hash  $name" + [char]10)
          $bytes = [System.IO.File]::ReadAllBytes($shaPath)
          if ($bytes -contains 13) {
            throw "checksum file contains a carriage return"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenTracker.Windows-${{ inputs.version }}-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error
